name = "shopify-order-export"
pages_build_output_dir = ".vercel/output/static"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables will be set in Cloudflare dashboard
# These are placeholders for local development
[vars]
NODE_ENV = "production"

# Optional: KV namespace for caching (create in Cloudflare dashboard)
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# Build configuration for Pages
[build]
command = "npm run build:cloudflare"

[build.upload]
format = "service-worker"
